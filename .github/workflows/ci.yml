name: CI

# Triggers
#   release: gate every published release on a green build.
#   workflow_dispatch: run on demand from the Actions tab without
#     having to cut a release (useful for sanity-checking main).
#
#   Want feedback on every push or PR? Uncomment the blocks below.
on:
  release:
    types: [published]
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + Docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check src

      - name: Ruff (format check)
        run: uv run ruff format --check src

      - name: Pytest
        run: |
          if compgen -G "tests/**/*.py" > /dev/null || compgen -G "src/**/test_*.py" > /dev/null; then
            uv run pytest -q
          else
            echo "No tests yet, skipping."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (smoke)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: open-energy-rag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-run image
        run: |
          docker run --rm -d --name oer-ci \
            -p 8000:8000 \
            -e LLM_PROVIDER=groq \
            -e GROQ_API_KEY=ci-placeholder \
            -e QDRANT_URL=http://localhost:6333 \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            open-energy-rag-api:ci
          # /health does not touch Qdrant or the LLM and must come up fast.
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "image is healthy"
              docker logs oer-ci | tail -20
              docker stop oer-ci
              exit 0
            fi
            sleep 2
          done
          echo "image failed to become healthy"
          docker logs oer-ci
          docker stop oer-ci || true
          exit 1

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Build-time only; the actual prod URL is set by Vercel.
          BACKEND_URL: https://example.invalid
