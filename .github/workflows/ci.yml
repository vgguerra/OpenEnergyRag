name: CI

# Runs on release publish (the canonical gate) and on manual dispatch
# from the Actions tab.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   HF_TOKEN, HF_USERNAME, HF_SPACE_NAME
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: backend (deps + Docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: open-energy-rag-api:ci
          # No GHA cache: torch + CUDA + docling layers in this image
          # push ~2 GB into the cache and the export itself blew past the
          # job's timeout on the first run. A clean build runs in ~90 s,
          # which is fine for a release-gated workflow.

  frontend-checks:
    name: frontend (deps + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          BACKEND_URL: https://example.invalid

  deploy-backend:
    name: deploy backend to HF Spaces
    needs: backend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          TAG: ${{ github.event.release.tag_name || github.sha }}
        run: |
          set -euo pipefail
          REMOTE="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}.git"
          git clone --depth=1 "$REMOTE" hf-space
          rsync -av --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='qdrant_storage' \
            --exclude='.fastembed_cache' \
            --exclude='.hf_cache' \
            --exclude='README.md' \
            --exclude='huggingface-README.md' \
            backend/ hf-space/
          cp backend/huggingface-README.md hf-space/README.md
          cd hf-space
          git config user.email "ci@github.actions"
          git config user.name "CI"
          if git diff --quiet && git diff --quiet --cached; then
            echo "Nothing to deploy."
            exit 0
          fi
          git add .
          git commit -q -m "deploy: ${TAG}"
          git push origin HEAD:main

  deploy-frontend:
    name: deploy frontend to Vercel
    needs: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project info
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
