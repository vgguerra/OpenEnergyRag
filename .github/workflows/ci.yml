name: CI

# Triggers
#   release (published): the canonical gate. Runs checks, then deploys
#     the backend to Hugging Face Spaces and the frontend to Vercel.
#   workflow_dispatch: run on demand. Useful to validate main without
#     cutting a release; deploys also run if you trigger from main.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   HF_TOKEN, HF_USERNAME, HF_SPACE_NAME
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: backend (lint + Docker smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check src

      - name: Ruff (format check)
        run: uv run ruff format --check src

      - name: Pytest
        run: |
          if compgen -G "tests/**/*.py" > /dev/null || compgen -G "src/**/test_*.py" > /dev/null; then
            uv run pytest -q
          else
            echo "No tests yet, skipping."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (smoke)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: open-energy-rag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-run image
        run: |
          docker run --rm -d --name oer-ci \
            -p 8000:8000 \
            -e LLM_PROVIDER=groq \
            -e GROQ_API_KEY=ci-placeholder \
            -e QDRANT_URL=http://localhost:6333 \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            open-energy-rag-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "image is healthy"
              docker logs oer-ci | tail -20
              docker stop oer-ci
              exit 0
            fi
            sleep 2
          done
          echo "image failed to become healthy"
          docker logs oer-ci
          docker stop oer-ci || true
          exit 1

  frontend-checks:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          BACKEND_URL: https://example.invalid

  deploy-backend:
    name: deploy backend to HF Spaces
    needs: backend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          TAG: ${{ github.event.release.tag_name || github.sha }}
        run: |
          set -euo pipefail
          REMOTE="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}.git"
          git clone --depth=1 "$REMOTE" hf-space
          rsync -av --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='qdrant_storage' \
            --exclude='.fastembed_cache' \
            --exclude='.hf_cache' \
            --exclude='README.md' \
            --exclude='huggingface-README.md' \
            backend/ hf-space/
          # Re-emit the Space README (with YAML frontmatter) on every run.
          cp backend/huggingface-README.md hf-space/README.md
          cd hf-space
          git config user.email "ci@github.actions"
          git config user.name "CI"
          if git diff --quiet && git diff --quiet --cached; then
            echo "Nothing to deploy."
            exit 0
          fi
          git add .
          git commit -q -m "deploy: ${TAG}"
          git push origin HEAD:main

  deploy-frontend:
    name: deploy frontend to Vercel
    needs: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project info
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (prod)
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
