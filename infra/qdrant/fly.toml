# Fly config for the Qdrant vector store.
#
# Deploy from the repo root:
#   flyctl launch --config infra/qdrant/fly.toml --no-deploy
#   flyctl volumes create qdrant_data --size 3 --region gru -a open-energy-rag-qdrant
#   flyctl deploy --config infra/qdrant/fly.toml
#
# The service is intentionally NOT public: the backend talks to it over
# Fly's private network (flycast). For local ingestion, open a tunnel:
#   flyctl proxy 6333:6333 -a open-energy-rag-qdrant

app = "open-energy-rag-qdrant"
primary_region = "gru"

[build]
  image = "qdrant/qdrant:v1.13.0"

[env]
  QDRANT__SERVICE__HTTP_PORT = "6333"
  QDRANT__SERVICE__GRPC_PORT = "6334"
  # Enforce an API key in production. The actual value is set via
  # `flyctl secrets set QDRANT__SERVICE__API_KEY=... -a open-energy-rag-qdrant`.

[[mounts]]
  source = "qdrant_data"
  destination = "/qdrant/storage"

# Internal-only TCP service, reachable as open-energy-rag-qdrant.flycast.
[[services]]
  protocol = "tcp"
  internal_port = 6333
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
