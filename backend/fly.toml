# Fly config for the FastAPI backend.
#
# Deploy from the repo root:
#   flyctl launch --config backend/fly.toml --no-deploy
#   flyctl volumes create fastembed_cache --size 5 --region gru -a open-energy-rag-api
#   flyctl secrets set \
#     GROQ_API_KEY=... \
#     QDRANT_API_KEY=... \
#     -a open-energy-rag-api
#   flyctl deploy --config backend/fly.toml

app = "open-energy-rag-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  RELOAD = "false"
  HOST = "0.0.0.0"
  LLM_PROVIDER = "groq"
  LLM_MODEL = "llama-3.3-70b-versatile"
  EMBEDDING_MODEL = "intfloat/multilingual-e5-large"
  EMBEDDING_DEVICE = "cpu"
  QDRANT_URL = "http://open-energy-rag-qdrant.flycast:6333"
  QDRANT_COLLECTION = "open-energy"
  CHUNK_SIZE_TOKENS = "300"
  CHUNK_OVERLAP_TOKENS = "40"
  FASTEMBED_CACHE_DIR = "/app/.fastembed_cache"
  HF_HOME = "/app/.hf_cache"
  # CORS_ALLOWED_ORIGINS is set after the Vercel app exists, via:
  #   flyctl secrets set CORS_ALLOWED_ORIGINS=https://open-energy-rag.vercel.app -a open-energy-rag-api
  # GROQ_API_KEY and QDRANT_API_KEY are managed as Fly secrets, not in this file.

# Persist the fastembed cache so cold starts don't re-download the
# multilingual-e5-large model (~2.5 GB) every restart.
[[mounts]]
  source = "fastembed_cache"
  destination = "/app/.fastembed_cache"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
