[project]
name = "open-energy-rag-backend"
version = "0.1.0"
description = "RAG assistant over Brazilian electricity sector regulations (ANEEL, ONS, MME)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.28.0",
    "qdrant-client>=1.13.0",
    "docling>=2.16.0",
    "fastembed>=0.5.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
]
